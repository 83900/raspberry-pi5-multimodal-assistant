[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-edge-assistant"
version = "0.4.0"
description = "Local-first bilingual multimodal assistant for Raspberry Pi 5"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "psutil>=6,<8",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
pi = [
  "pillow>=10,<13",
  "piper-tts>=1.3,<2",
]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]
vision-intent = [
  "numpy>=1.26,<2",
  "onnxruntime>=1.16,<2",
  "tokenizers>=0.13,<0.14",
]

[project.scripts]
pi-edge-assistant = "pi_edge_assistant.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pi_edge_assistant = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
